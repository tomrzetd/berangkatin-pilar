name: Uji PILAR
run-name: "test · ${{ github.event_name == 'pull_request' && format('PR #{0} · {1}', github.event.number, github.event.pull_request.title) || format('{0} · build #{1}', github.ref_name, github.run_number) }}"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uji:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Semua uji (struktur Hub, fisika, logika, aksara, optik, …)
        run: node tests/jalankan-semua.mjs
