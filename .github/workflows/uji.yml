name: Uji PILAR

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uji:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Semua uji (struktur Hub, fisika, logika, aksara, optik, …)
        run: node tests/jalankan-semua.mjs
