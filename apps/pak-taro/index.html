<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef6ea">
<meta name="description" content="Lab Misteri Pak Taro — soal Pupuk Ajaib (Informatika kelas VIII): enam gelas, satu berisi air. Temukan lewat percobaan, irisan himpunan, dan kode biner.">
<title>PILAR™ · Lab Misteri Pak Taro · Pupuk Ajaib</title>
<script src="../../core/device-profile.js"></script>
<style>
@font-face{font-family:"Plus Jakarta Sans";src:url("../../vendor/fonts/plus-jakarta-sans-var.woff2") format("woff2");font-weight:200 800;font-display:swap}
@font-face{font-family:"Fraunces";src:url("../../vendor/fonts/fraunces-var.woff") format("woff");font-weight:400 800;font-display:swap}
@font-face{font-family:"Fraunces";src:url("../../vendor/fonts/fraunces-italic-var.woff") format("woff");font-weight:400 700;font-style:italic;font-display:swap}
@font-face{font-family:"Plex Mono";src:url("../../vendor/fonts/ibm-plex-mono-medium.woff") format("woff");font-weight:500;font-display:swap}
:root{
 --bg:#eef4ea;--stage:#f8fbf3;--stage2:#e6f0dc;--card:#fff;--card2:#f5f9f0;--ink:#17301f;--ink2:#506556;--ink3:#8a9b8e;--line:#dbe6d3;
 --pri:#2f8a4e;--pri2:#47b06a;--acc:#e8578b;--gold:#e0a526;--bad:#d9534f;--shadow:0 8px 24px rgb(31 70 40/.08);--r:16px;--fs:1;
 --liquid:#8fdcc0;--liquid2:#4fbf98;--wood:#b98552;--wood2:#8f6237;--pot:#c8693f;--pot2:#a9512c;
 --serif:"Fraunces",Georgia,serif;--sans:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;--mono:"Plex Mono",ui-monospace,Consolas,monospace;
}
html[data-skin="pink"]{--bg:#fff3f8;--stage:#fffafc;--stage2:#fbe9f1;--card2:#fff5fa;--ink:#3a1430;--ink2:#7a4a68;--line:#f6d6e6;--pri:#c2367a;--pri2:#e8578b}
html[data-skin="gelap"]{--bg:#07120c;--stage:#0c1a12;--stage2:#10241a;--card:#10201a;--card2:#142a20;--ink:#e6f4ea;--ink2:#a9c4b2;--ink3:#6f8c7a;--line:#21402f;--shadow:0 10px 30px #0007;--wood:#6d4b2c;--wood2:#4b321c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.app{height:100vh;height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:clamp(6px,.8vh,12px);padding:clamp(6px,.9vh,14px) clamp(8px,1vw,18px)}
.hd{display:flex;align-items:center;gap:clamp(8px,1vw,16px);min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;min-height:clamp(38px,4.8vh,58px);padding:0 1.1em;border:1px solid var(--line);border-radius:999px;background:var(--card);
 font-weight:800;font-size:clamp(13px,1.5vh,19px);cursor:pointer;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);touch-action:manipulation;white-space:nowrap;user-select:none}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm{min-height:clamp(32px,3.8vh,46px);padding:0 .85em;font-size:clamp(12px,1.3vh,16px)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.brand{display:grid;line-height:1.05}
.brand b{font:800 clamp(17px,2.4vh,30px) var(--serif);letter-spacing:-.02em}
.brand b i{color:var(--pri);font-style:italic;font-weight:600}
.brand small{font:500 clamp(9px,1.05vh,13px) var(--mono);letter-spacing:.12em;color:var(--ink3);text-transform:uppercase}
.credit{margin-left:auto;font:500 clamp(9px,1.05vh,13px) var(--mono);color:var(--ink2);padding:.3em .7em;border:1px dashed var(--line);border-radius:8px;background:var(--card2)}
.main{display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,28vw,540px);gap:clamp(8px,1vw,16px);min-height:0}
.stage{position:relative;min-height:0;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);container-type:size;
 background:radial-gradient(120% 70% at 85% -10%,#fff7c2aa,transparent 60%),linear-gradient(180deg,var(--stage),var(--stage2))}
html[data-skin="gelap"] .stage{background:radial-gradient(120% 70% at 85% -10%,#ffe08a1a,transparent 60%),linear-gradient(180deg,var(--stage),var(--stage2))}
.scene{position:absolute;inset:0;padding:clamp(10px,2cqh,22px);display:grid;gap:clamp(6px,1.4cqh,14px)}
.toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:20;padding:.55em 1.1em;border-radius:999px;background:var(--pri);color:#fff;font-weight:800;font-size:clamp(13px,1.7vh,21px);box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap}
.toast.on{opacity:1}.toast.bad{background:var(--bad)}

/* ---------- panel ---------- */
.panel{min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:calc(.7vh*var(--fs) + 4px);padding:clamp(12px,1.6vh,22px) clamp(14px,1.3vw,24px);border-radius:var(--r);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);font-size:calc(clamp(13px,1.62vh,21px)*var(--fs))}
.kick{font:500 .72em var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--pri)}
.panel h1{margin:0;font:800 1.7em/1.06 var(--serif);letter-spacing:-.02em}
.panel h1 i{font-weight:600;color:var(--pri)}
.story{margin:0;line-height:1.5}
.story b{color:var(--pri)}
.mission{border:1.5px solid var(--line);border-left:5px solid var(--gold);border-radius:12px;padding:.6em .8em;background:var(--card2);display:grid;gap:.25em}
.mission .mh{display:flex;justify-content:space-between;gap:.5em;font:800 .78em var(--sans);letter-spacing:.08em;text-transform:uppercase;color:#b07d10}
.mission .mt{line-height:1.4}.mission .st{font:500 .82em var(--mono);color:var(--ink2)}
.mission.done{border-left-color:var(--pri)}.mission.done .mh{color:var(--pri)}
.ctrls{display:flex;flex-wrap:wrap;gap:.5em}
.ctrls .btn{font-size:.9em;min-height:2.5em}
.ct{margin-top:auto;border-radius:12px;padding:.65em .85em;background:var(--card2);border:1px solid var(--line);line-height:1.45;font-size:.92em}
.ct summary{list-style:none;cursor:pointer;font:800 .78em var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.ct summary::-webkit-details-marker{display:none}
.ct p{margin:.3em 0 0}
.ct .tag{display:inline-block;margin:.35em .3em 0 0;padding:.15em .55em;border-radius:999px;background:var(--card);border:1px solid var(--line);font:600 .78em var(--sans)}
.ct .tag.on{background:var(--pri);border-color:var(--pri);color:#fff}

/* ---------- navigasi langkah ---------- */
.nav{display:flex;align-items:center;gap:clamp(6px,.8vw,12px);padding-right:clamp(54px,4.2vw,76px);min-width:0}
.dots{flex:1;display:flex;gap:clamp(4px,.5vw,8px);min-width:0}
.dot{flex:1;min-width:0;display:flex;align-items:center;gap:.45em;min-height:clamp(38px,4.8vh,56px);padding:0 .8em;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;
 font-weight:700;font-size:clamp(11px,1.35vh,17px);color:var(--ink2);white-space:nowrap;overflow:hidden;touch-action:manipulation}
.dot .no{font:500 .85em var(--mono);color:var(--ink3)}.dot .ic{font-size:1.15em}
.dot span.t{overflow:hidden;text-overflow:ellipsis}
.dot.cur{border-color:var(--ink);color:var(--ink);box-shadow:inset 0 -3px 0 var(--pri)}
.dot.done .no::after{content:" ✓";color:var(--pri)}

/* ---------- bunga (SVG) ---------- */
.flower{display:block;width:100%;height:100%;overflow:visible}
.flower .petal{fill:#ff80b0;stroke:#e95d93;stroke-width:1;transition:fill .7s,stroke .7s}
.flower.f-white .petal{fill:#fffefe;stroke:#e9c5d6}
.flower .l2{transform-box:fill-box;transform-origin:center;opacity:0;transform:scale(.2) rotate(-40deg);transition:opacity .7s,transform .8s cubic-bezier(.3,1.5,.5,1)}
.flower.f-double .l2{opacity:1;transform:scale(1) rotate(0)}
.flower .l2 .petal{fill:#ff5f9c}.flower.f-white .l2 .petal{fill:#fff4f8}
.flower .core{fill:#ffc83d;stroke:#e0a526;stroke-width:1.5;transition:fill .7s,stroke .7s}
.flower.f-black .core{fill:#1d1d1d;stroke:#000}
.flower .stem{fill:none;stroke:#3f9a4f;stroke-width:5;stroke-linecap:round;transition:opacity .6s}
.flower .stem.wavy{opacity:0}.flower.f-wavy .stem.wavy{opacity:1}.flower.f-wavy .stem.straight{opacity:0}
.flower .leaf{fill:#57b65d;stroke:#3c8d43;stroke-width:1;transform-box:fill-box;transform:scale(0);transition:transform .8s cubic-bezier(.3,1.6,.5,1)}
.flower .leaf.l{transform-origin:100% 100%}.flower .leaf.r{transform-origin:0 100%}
.flower.f-leaf .leaf{transform:scale(1)}
.flower .pot{fill:var(--pot)}.flower .rim{fill:var(--pot2)}.flower .soil{fill:#5b3b22}
.flower .wet{fill:#4f9fd9;opacity:0}.flower.watering .wet{animation:wet 1.4s}
@keyframes wet{30%{opacity:.6}100%{opacity:0}}
.flower .spark{fill:none;stroke:#ffd54a;stroke-width:3;opacity:0}.flower.sparkle .spark{animation:spark 1s .3s}
@keyframes spark{0%{opacity:0;transform:scale(.6)}40%{opacity:1}100%{opacity:0;transform:scale(1.25)}}
.flower .spark{transform-box:fill-box;transform-origin:center}

/* ---------- gelas ---------- */
.glass{display:grid;justify-items:center;gap:.15em;cursor:pointer;user-select:none;touch-action:manipulation;border:0;background:none;padding:0;position:relative}
.glass svg{width:100%;height:auto;overflow:visible}
.glass .gl{fill:#ffffffb0;stroke:#9fb7a6;stroke-width:2}
html[data-skin="gelap"] .glass .gl{fill:#ffffff18;stroke:#5f7f6a}
.glass .lq{fill:url(#lq)}
.glass .shine{fill:#ffffffaa}
.glass .lbl{font:800 clamp(14px,2.4cqh,30px) var(--serif);color:var(--ink);line-height:1}
.glass .sub{font:600 clamp(9px,1.5cqh,15px) var(--mono);letter-spacing:.08em;color:var(--acc)}
.glass .badge{position:absolute;top:-.3em;right:-.3em;font-size:clamp(14px,2.6cqh,30px);background:var(--card);border:2px solid var(--pri);border-radius:999px;width:1.6em;height:1.6em;display:grid;place-items:center;box-shadow:var(--shadow);animation:pop .5s}
.glass.water .badge{border-color:#3b8fd6}
.glass.sel svg .gl{stroke:var(--acc);stroke-width:3.5}
.glass.in{opacity:.38}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.shelf{height:clamp(8px,1.4cqh,16px);border-radius:6px;background:linear-gradient(var(--wood),var(--wood2));box-shadow:0 4px 0 #0002}
.pour{animation:pour .9s}
@keyframes pour{40%{transform:translateY(-14%) rotate(-28deg)}100%{transform:none}}

/* ---------- komponen adegan ---------- */
.chips{display:flex;flex-wrap:wrap;gap:clamp(4px,.8cqh,10px);justify-content:center}
.chip{display:inline-flex;align-items:center;gap:.35em;min-height:clamp(36px,6cqh,64px);padding:0 .8em;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:clamp(12px,2cqh,20px);cursor:pointer;user-select:none;touch-action:manipulation;color:var(--ink)}
.chip .i{font-size:1.25em}
.chip.on{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 14%,var(--card));background:var(--card2)}
.chip.on{box-shadow:inset 0 0 0 2px var(--pri)}
.chip.ok{border-color:var(--pri);background:var(--pri);color:#fff}
.chip.no{border-color:var(--bad);animation:shake .4s}
.chip.empty{border-style:dashed}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bubble{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:.7em 1em;box-shadow:var(--shadow);font-size:clamp(13px,2.1cqh,22px);line-height:1.45}
.bubble b{color:var(--pri)}
.label{font:500 clamp(10px,1.6cqh,16px) var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.potcard{display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:clamp(4px,.8cqh,10px);justify-items:center;padding:clamp(6px,1.2cqh,14px);border-radius:16px;background:color-mix(in srgb,var(--card) 70%,transparent);background:var(--card);border:1.5px solid var(--line);min-height:0;min-width:0}
.potcard.ok{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 25%,transparent)}
.potcard.tgt{border-color:var(--acc);box-shadow:0 0 0 3px #e8578b44}
.potcard h3{margin:0;font:800 clamp(14px,2.4cqh,26px) var(--serif)}
.potcard .mix{font:600 clamp(11px,1.8cqh,19px) var(--mono);color:var(--ink2)}
.fl{min-height:0;min-width:0;width:100%;height:100%;overflow:hidden}
.fl svg{pointer-events:none}
.venn{width:100%;height:100%}
.venn .c{fill-opacity:.12;stroke-width:3;transition:fill-opacity .4s}
.venn .c.hi{fill-opacity:.32}
.venn text{font-family:var(--sans);font-weight:800}
.tbl{border-collapse:separate;border-spacing:clamp(3px,.6cqh,8px);margin:auto;font-size:clamp(13px,2.6cqh,26px)}
.tbl th{font:800 .8em var(--sans);color:var(--ink2);padding:0 .4em}
.tbl td{min-width:2.4em;height:2.1em;text-align:center;border-radius:10px;background:var(--card);border:1.5px solid var(--line);font:600 1em var(--mono)}
.tbl td.one{background:var(--pri);color:#fff;border-color:var(--pri)}
.tbl td.code{font-weight:800;letter-spacing:.12em;background:var(--card2);color:var(--acc)}
.tbl td.g{font:800 1.05em var(--serif);background:none;border:0}
.tbl tr.hl td{outline:3px solid var(--gold);outline-offset:1px}
.algo{display:grid;gap:clamp(4px,.8cqh,10px);counter-reset:a}
.algo div{display:grid;grid-template-columns:auto 1fr;gap:.6em;align-items:center;padding:.45em .7em;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-size:clamp(12px,2cqh,19px);line-height:1.35}
.algo div::before{counter-increment:a;content:counter(a);display:grid;place-items:center;width:1.8em;height:1.8em;border-radius:50%;background:var(--pri);color:#fff;font-weight:800}
.algo b{color:var(--pri)}

/* panggung tegak (HP): susun ulang tiap adegan */
@container (max-width: 620px){
 .s-kode{grid-template-columns:minmax(0,1fr)!important}
 .s-kode>*{grid-column:auto!important;grid-row:auto!important}
 .s-kode{grid-template-rows:auto minmax(0,1fr) auto!important}.s-kode .algo{display:none}.s-kode>div:nth-child(2){grid-template-rows:minmax(0,1fr)!important}
 .s-percobaan{grid-template-columns:repeat(3,minmax(0,1fr))!important}.s-percobaan .base{display:none}.s-percobaan>.chips:last-child{grid-column:1/4!important}
 .s-percobaan .potcard .chip{min-height:28px;font-size:12px;padding:0 .3em!important}
 .s-lab{grid-template-columns:repeat(3,minmax(0,1fr))!important}.s-lab .codes{display:none!important}.s-lab .potcard .mix{font-size:11px!important}.s-lab>:first-child{grid-column:1/4!important}.s-lab>.chips{grid-column:1/4!important}
 .potcard h3{font-size:13px}.potcard .mix{font-size:11px}
}
@media (max-width:900px) and (orientation:portrait){
 .main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1.15fr) minmax(0,1fr)}
 .credit{display:none}.hd .credit{display:block;position:absolute;right:10px;top:44px;font-size:8.5px;padding:.1em .3em;border:0;background:none;opacity:.8}
 .dot span.t,.dot .no{display:none}.dot{justify-content:center;padding:0}
 .panel{overflow-y:auto}.brand small{display:none}
}
</style>
</head>

<div class="app">
 <header class="hd">

 </nav>
</div>
