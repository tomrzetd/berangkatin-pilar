<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f9ff">
<meta name="description" content="Papan Rangkai — rangkai kabel gaya breadboard, otomatis menempel ke grid dan pin, netlist, simulasi gerbang logika NOT AND OR NAND NOR XOR (simbol & IC 74HC), tabel kebenaran, dan board Sebatang-Kara.">
<title>PILAR™ · Papan Rangkai · Logika & Wiring</title>
<link rel="stylesheet" href="../../css/pilar-ceria.css">
<script src="../../core/device-profile.js"></script>
<style>
html,body{height:100%;overflow:hidden}
body.ceria{display:grid;grid-template-rows:auto 1fr;height:100dvh}
.bar{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;padding:.45rem .6rem;border-bottom:var(--bw) solid var(--ink);background:#fff;z-index:5}
.bar .back{width:var(--tap);padding:0}
.bar h1{margin:0 .3rem 0 .1rem;font-size:1.1rem;line-height:1;white-space:nowrap}
.bar h1 small{display:block;font:800 .72rem var(--f-body);color:var(--ink2)}
.bar .sp{flex:1}
.bar .c-btn.sm{min-height:calc(var(--tap)*.72);padding:.15em .55em;font-size:.86rem;box-shadow:3px 3px 0 var(--ink)}
.grp{display:inline-flex;gap:.3rem;padding:.2rem;border:2px dashed #c9d6e4;border-radius:16px}
.main{display:grid;grid-template-columns:15.5rem 1fr 19rem;min-height:0}
.pal,.side{overflow:auto;overscroll-behavior:contain;background:#fbfdff;padding:.55rem}
.pal{border-right:var(--bw) solid var(--ink)}
.side{border-left:var(--bw) solid var(--ink);display:flex;flex-direction:column;gap:.6rem}
.pal h3{margin:.6rem 0 .3rem;font-size:.95rem;display:flex;align-items:center;gap:.4rem}
.pal h3:first-child{margin-top:0}
.items{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
.item{display:grid;grid-template-rows:3.6rem auto;place-items:center;gap:.15rem;padding:.3rem;border:2px solid var(--ink);border-radius:12px;background:#fff;cursor:grab;touch-action:none;user-select:none;box-shadow:2px 3px 0 var(--ink)}
.item svg{width:100%;height:100%}
.item span{font:800 .68rem var(--f-body);text-align:center;line-height:1.15}
.item.on{background:var(--yellow)}
.stage{position:relative;min-width:0;min-height:0;background:#eceee9}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:default}
#cv.wire{cursor:crosshair}#cv.del{cursor:not-allowed}#cv.pan{cursor:grabbing}
.hud{position:absolute;left:.6rem;bottom:.6rem;display:flex;gap:.35rem;flex-wrap:wrap;pointer-events:none}
.hud>*{pointer-events:auto}
.chip{display:inline-flex;align-items:center;gap:.35em;padding:.25em .7em;border:2px solid var(--ink);border-radius:999px;background:#fff;font-weight:900;font-size:.82rem;box-shadow:2px 2px 0 var(--ink)}
.chip.err{background:#ffd3d3}.chip.ok{background:#c9f5c4}.chip.warn{background:#fff1b8}
.tip{position:absolute;pointer-events:none;z-index:9;padding:.25em .6em;border:2px solid var(--ink);border-radius:10px;background:#fff;font-weight:800;font-size:.8rem;white-space:nowrap;box-shadow:2px 2px 0 var(--ink);display:none}
.toast{position:absolute;left:50%;top:.7rem;transform:translateX(-50%);z-index:9;max-width:min(680px,90%);padding:.5em 1em;border:var(--bw) solid var(--ink);border-radius:16px;background:var(--yellow);font-weight:800;box-shadow:var(--shadow);display:none;text-align:center}
.zoom{position:absolute;right:.6rem;bottom:.6rem;display:flex;flex-direction:column;gap:.35rem}
.zoom .c-btn{width:calc(var(--tap)*.8);min-height:calc(var(--tap)*.8);padding:0}
.card{border:var(--bw) solid var(--ink);border-radius:16px;background:#fff;padding:.6rem .7rem;box-shadow:3px 3px 0 #17243a22}
.card h3{margin:0 0 .4rem;font-size:1.02rem}
.card .row{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;margin:.3rem 0}
.card label{font-weight:800;font-size:.85rem}
.card input[type=text],.card select{font:800 .95rem var(--f-body);padding:.3em .5em;border:2px solid var(--ink);border-radius:10px;min-height:2.3rem;background:#fff;color:var(--ink)}
.sw{width:1.9rem;height:1.9rem;border:2px solid var(--ink);border-radius:50%;cursor:pointer}
.sw.on{outline:3px solid var(--blue-d);outline-offset:2px}
.msgs{list-style:none;margin:0;padding:0;display:grid;gap:.35rem}
.msgs li{border:2px solid var(--ink);border-radius:10px;padding:.35em .55em;font-size:.84rem;font-weight:700;line-height:1.35;cursor:pointer}
.msgs li.error{background:#ffe0e0}.msgs li.warn{background:#fff6cf}.msgs li.ok{background:#dcf9d8}
pre.net{margin:0;max-height:16rem;overflow:auto;font:600 .72rem/1.45 ui-monospace,Consolas,monospace;background:#f4f8ff;border:2px solid var(--ink);border-radius:10px;padding:.5em;white-space:pre}
.tabs{display:flex;gap:.3rem}
.tabs button{flex:1}
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:#17243a55;padding:1rem}
.modal[hidden]{display:none}
.modal .c-card{max-width:min(860px,96vw);max-height:92vh;overflow:auto;width:100%}
.tt{border-collapse:collapse;margin:.6rem auto;font:800 1.05rem var(--f-head)}
.tt th,.tt td{border:2px solid var(--ink);padding:.3em .8em;text-align:center;min-width:2.6em}
.tt th{background:var(--blue)}.tt th.o{background:var(--yellow)}.tt th.t{background:var(--purple)}
.tt td.one{background:#fff2a8}.tt tr.cur td{outline:3px solid var(--blue-d);outline-offset:-3px}
.tt td.bad{background:#ffc6c6}.tt td.good{background:#c9f5c4}
.list{display:grid;gap:.5rem}
.list button{justify-content:flex-start;text-align:left;width:100%}
.list button small{display:block;font:700 .82rem var(--f-body);color:var(--ink2)}
.goal{background:var(--mint)}
.goal .t{font:600 1.05rem var(--f-head)}
.hide-sm{}
.bar .lbl{}@media(max-width:1500px){.bar .lbl{display:none}}
@media(max-width:1100px){.main{grid-template-columns:12.5rem 1fr 15rem}.hide-sm{display:none}}
@media(max-width:800px){
  .main{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .pal{position:absolute;z-index:8;left:0;top:0;bottom:0;width:15rem;transform:translateX(-105%);transition:transform .2s;border-right:var(--bw) solid var(--ink)}
  .pal.open{transform:none}
  .side{border-left:0;border-top:var(--bw) solid var(--ink);max-height:38vh}
  .stage{min-height:52vh}
}
@media(min-width:801px){#btnPal{display:none}}
</style>
</head>
<body class="ceria">
<header class="bar">
  <a class="c-btn back" href="../../index.html" aria-label="Kembali ke PILAR Hub">←</a>
  <h1>Papan Rangkai<small>Logika & wiring · auto-snap · netlist</small></h1>
  <button class="c-btn sm" id="btnPal" aria-label="Komponen">🧩</button>
  <span class="grp" role="group" aria-label="Alat">
    <button class="c-btn sm on" data-tool="select" title="Pilih & pindah (V)">✋ Pilih</button>
    <button class="c-btn sm" data-tool="wire" title="Tarik kabel (W)">〰 Kabel</button>
    <button class="c-btn sm" data-tool="delete" title="Hapus (D)">🗑</button>
  </span>
  <button class="c-btn sm go" id="btnSim" aria-pressed="false" title="Simulasi logika (S)">▶ Simulasi</button>
  <button class="c-btn sm info" id="btnTT">🔢<span class="lbl"> Tabel</span></button>
  <button class="c-btn sm" id="btnCheck">🩺<span class="lbl"> Periksa</span></button>
  <span class="sp"></span>
  <button class="c-btn sm alt" id="btnEx">📚<span class="lbl"> Contoh</span></button>
  <button class="c-btn sm alt" id="btnCh">🏆<span class="lbl"> Tantangan</span></button>
  <span class="grp hide-sm">
    <button class="c-btn sm" id="btnUndo" title="Batal (Ctrl+Z)">↶</button>
    <button class="c-btn sm" id="btnRedo" title="Ulang (Ctrl+Y)">↷</button>
  </span>
  <span class="grp hide-sm">
    <button class="c-btn sm" id="btnStyle" title="Gaya kabel">〽 Breadboard</button>
    <button class="c-btn sm" id="btnSave" title="Simpan file .json">💾</button>
    <button class="c-btn sm" id="btnOpen" title="Buka file .json">📂</button>
    <button class="c-btn sm" id="btnPng" title="Unduh gambar PNG">🖼</button>
    <button class="c-btn sm stop" id="btnClear" title="Kosongkan papan">✖</button>
  </span>
  <input type="file" id="file" accept=".json,application/json" hidden>
</header>
<div class="main">
  <aside class="pal" id="pal" aria-label="Komponen"></aside>
  <section class="stage" id="stage">
    <svg id="cv" xmlns="http://www.w3.org/2000/svg" aria-label="Papan rangkaian">
      <defs id="defs"></defs>
      <rect id="bgGrid" x="-50000" y="-50000" width="100000" height="100000" fill="url(#gridP)"/>
      <g id="world"><g id="lBB"></g><g id="lParts"></g><g id="lWires"></g><g id="lPins"></g><g id="lOver"></g></g>
    </svg>
    <div class="toast" id="toast"></div>
    <div class="tip" id="tip"></div>
    <div class="hud" id="hud"></div>
    <div class="zoom">
      <button class="c-btn sm" id="zIn" aria-label="Perbesar">＋</button>
      <button class="c-btn sm" id="zOut" aria-label="Perkecil">－</button>
      <button class="c-btn sm" id="zFit" aria-label="Pas layar">⤢</button>
    </div>
  </section>
  <aside class="side" id="side">
    <div class="card goal" id="goal" hidden></div>
    <div class="card" id="insp"></div>
    <div class="card">
      <div class="tabs"><button class="c-btn sm on" data-tab="msg">Pesan</button><button class="c-btn sm" data-tab="net">Netlist</button></div>
      <div id="tabMsg" style="margin-top:.5rem"><ul class="msgs" id="msgs"></ul></div>
      <div id="tabNet" style="margin-top:.5rem" hidden><pre class="net" id="netTxt"></pre>
        <div class="row" style="margin-top:.4rem"><button class="c-btn sm" id="btnCopyNet">📋 Salin</button><button class="c-btn sm" id="btnNetFile">⤓ .net</button></div></div>
    </div>
  </aside>
</div>

<div class="modal" id="modal" hidden><div class="c-card" id="modalBody"></div></div>

<script src="./core.js"></script>
<script src="./art.js"></script>
<script src="./templates.js"></script>
<script src="./ui.js"></script>
<script src="../../pulse/config.js"></script>
<script src="../../core/pulse.js"></script>
</body>
</html>
