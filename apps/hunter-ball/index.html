 .team.off{display:none}.brand small{display:none}.topbar>.creator{display:block;flex:1 1 100%;order:2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:8px}.topbar{flex-wrap:wrap}.tools{width:100%;order:3;justify-content:flex-start;overflow:auto;flex-wrap:nowrap}
 .roundBar{margin:6px 8px 0;flex-wrap:wrap;gap:6px 10px;padding:8px 10px}.roundBar .ico{display:none}.roundBar h2{font-size:15px}.roundBar p{font-size:12px}.roundBar .grow{flex-basis:100%}

<script>
(function(){
"use strict";
/* ═══════════════════════════════════════════════════════════════
   BOLA SANG PEMBURU · DUEL  (percobaan "Monyet & Pemburu")
   Tiap tim mengatur SUDUT θ dan KECEPATAN AWAL v, lalu adu cepat menekan TEMBAK.
   Saat bola keluar, magnet melepas target → target jatuh bebas.
     bola   : x = x0 + v·cosθ·t        y = y0 + v·sinθ·t − ½·g·t²
     target : x = X                    y = Y − ½·g·t²
   Keduanya turun ½·g·t² yang sama ⇒ bidik LURUS ke target pasti kena,
   asalkan v cukup besar sehingga bola tiba sebelum target menyentuh tanah.
   Fisika analitik: posisi dihitung dari waktu, hasil sama di 15 maupun 60 fps.
   ═══════════════════════════════════════════════════════════════ */
var $=function(id){return document.getElementById(id)};
var WW=26,WH=19,PIV={x:1.7,y:1.05},BARREL=1.5,RB=.32,RT=.62,AMMO=3,ROUND_T=45;
var PLANETS={bumi:{n:"Bumi",i:"🌍",g:9.8},bulan:{n:"Bulan",i:"🌙",g:1.62},mars:{n:"Mars",i:"🔴",g:3.71},jupiter:{n:"Jupiter",i:"🪐",g:24.8}};
var COL={left:"#4fa8ff",right:"#ff5d75"};
var fmt=function(v,d){return Number(v).toFixed(d==null?1:d).replace(".",",")};
var clamp=function(v,a,b){return Math.max(a,Math.min(b,v))};
var DEG=Math.PI/180;
function rnd(a,b){return a+Math.random()*(b-a)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}

/* ───── ronde: makin lama makin menantang ───── */
var ROUNDS=[
 {planet:"bumi",laser:"long",dx:[13,14,15],dy:[8,9,10],ico:"🎯",title:"Ronde 1 · Kenali meriammu",text:"Putar meriam sampai <b>laser</b> menyentuh target, atur kecepatan, lalu <b>TEMBAK</b> secepatnya. Makin cepat kena, makin besar bonus."},
 {planet:"bumi",laser:"long",dx:[17,18,19],dy:[11,12,13],ico:"📏",title:"Ronde 2 · Target lebih jauh",text:"Target jatuh begitu kamu menembak. Perlukah membidik <b>lebih tinggi</b> dari target? Coba dan lihat Sinar-X!"},
 {planet:"bumi",laser:"short",dx:[16,18,20],dy:[9,10,12],ico:"🔦",title:"Ronde 3 · Laser pendek",text:"Laser tinggal pendek. Perkirakan sudutnya — atau hitung: <b>tan θ = tinggi ÷ jarak</b>."},
 {planet:"bulan",laser:"short",dx:[16,18,20],dy:[10,12],ico:"🌙",title:"Ronde 4 · Di Bulan (g = 1,62)",text:"Gravitasi kecil. Apakah sudutnya perlu diubah? Ingat: bola <b>dan</b> target sama-sama jatuh."},
 {planet:"jupiter",laser:"short",dx:[18,20],dy:[11,12],ico:"🪐",title:"Ronde 5 · Di Jupiter (g = 24,8)",text:"Target jatuh sangat cepat! Sudut tetap lurus, tetapi <b>kecepatan</b> harus cukup besar agar bola tiba sebelum target menyentuh tanah."}
];

/* ───── state ───── */
var S={mode:"duel",round:-1,phase:"idle",tStart:0,elapsed:0,xray:true,slow:false,sound:false,world:null,history:[],latihan:{planet:"bumi",release:"0",laser:"long"}};
var teams={};

function makeWorld(planet,laser,dxs,dys){
 var dx=pick(dxs||[14,16,18,20]),dy=pick(dys||[9,10,11,12]);
 var w={X:PIV.x+dx,Y:PIV.y+dy,dx:dx,dy:dy,g:PLANETS[planet].g,planet:planet,laser:laser||"long"};
 w.thT=Math.atan2(dy,dx);                                   // sudut lurus ke target
 w.D=Math.hypot(dx,dy)-BARREL;                              // jarak moncong → target
 w.tFloor=Math.sqrt(2*(w.Y-RT)/w.g);                         // waktu target sampai tanah
 w.vMin=w.D/w.tFloor;
 return w;
}
/* Satu tembakan dihitung sekali saat ditembak, lalu dianimasikan */
function simulate(w,v,angDeg,release){
 var th=angDeg*DEG,c=Math.cos(th),s=Math.sin(th),mx=PIV.x+c*BARREL,my=PIV.y+s*BARREL;
 var tRel=release==="off"?Infinity:+release||0,vx=v*c,vy=v*s;
 function ball(t){return{x:mx+vx*t,y:my+vy*t-.5*w.g*t*t}}
 function aim(t){return{x:mx+vx*t,y:my+vy*t}}                // posisi bila TANPA gravitasi
 function targ(t){if(t<=tRel)return{x:w.X,y:w.Y};var d=t-tRel;return{x:w.X,y:Math.max(RT,w.Y-.5*w.g*d*d)}}
 var r={v:v,ang:angDeg,th:th,vx:vx,vy:vy,mx:mx,my:my,tRel:tRel,ball:ball,aim:aim,targ:targ,hit:false,t:0,minD:1e9};
 for(var t=0;t<12;t+=.0005){var b=ball(t),q=targ(t),d=Math.hypot(b.x-q.x,b.y-q.y);
  if(!r.hit&&d<=RB+RT){r.hit=true;r.t=t;r.hb=b;r.ht=q}
  if(r.hit){if(d<r.minD)r.minD=d;else break}
  else if(b.y<RB||b.x>WW+3||b.x<-3){r.t=t;break}}
 r.end=r.t+(r.hit?1.3:.5);
 r.drop=.5*w.g*r.t*r.t;
 // diagnosis: di mana bola saat melewati garis jatuh target?
 var tx=(w.X-mx)/vx;r.tx=tx;
 if(vx>0&&tx>0){var bx=ball(tx),qx=targ(tx);r.pass={ballY:bx.y,targY:qx.y,ballLanded:bx.y<RB,targLanded:qx.y<=RT+1e-6&&tx>tRel}}
 return r;
}
function ringOf(minD){return minD<=.3?{pts:100,name:"pusat"}:minD<=.6?{pts:70,name:"cincin tengah"}:{pts:40,name:"tepi"}}
function explain(w,sim){
 var dθ=(sim.th-w.thT)/DEG,g=w.g,p=sim.pass;
 if(sim.hit)return{head:"🎯 KENA!",why:"Dalam "+fmt(sim.t,2)+" s bola turun "+fmt(sim.drop,2)+" m dari garis bidik — target juga turun "+fmt(sim.drop,2)+" m."};
 var slow={head:"❌ Terlambat tiba",why:"Target sudah sampai tanah dalam "+fmt(w.tFloor,2)+" s. Bidikanmu sudah benar, tetapi perlu kecepatan ≥ "+fmt(w.vMin)+" m/s."};
 if(p&&p.targLanded&&Math.abs(dθ)<1.5)return slow;
 if(!p||p.ballLanded)return{head:"❌ Bola jatuh sebelum sampai",why:"Bola menyentuh tanah sebelum mencapai garis target. Tambah kecepatan"+(dθ<-1.5?" dan naikkan sudut ("+fmt(-dθ)+"° terlalu rendah).":".")};
 if(p.targLanded)return{head:"❌ Terlambat tiba",why:"Target sudah sampai tanah dalam "+fmt(w.tFloor,2)+" s. Bola butuh "+fmt(sim.tx,2)+" s → perlu kecepatan ≥ "+fmt(w.vMin)+" m/s."};
 var above=p.ballY>p.targY;
 if(sim.tRel===Infinity)return{head:"❌ Lewat di BAWAH",why:"Target tidak dilepas, tetapi bola tetap jatuh ½·g·t² → bola turun di bawah target."};
 if(sim.tRel>0&&above)return{head:"❌ Lewat di ATAS",why:"Target dilepas terlambat "+fmt(sim.tRel,2)+" s, jadi target sudah lebih dulu jatuh."};
 if(above)return{head:"❌ Lewat di ATAS",why:"Bidikanmu "+fmt(Math.abs(dθ))+"° lebih TINGGI dari target. Target ikut jatuh, jadi tak perlu membidik di atasnya — bidik LURUS."};
 return{head:"❌ Lewat di BAWAH",why:"Bidikanmu "+fmt(Math.abs(dθ))+"° lebih RENDAH dari target. Naikkan sudut sampai lurus ke target."};
}

/* ───── kartu tim ───── */
function buildTeam(side){
 var el=$("team-"+side),name=side==="left"?"Tim Biru":"Tim Merah",bd=side==="left"?"B":"M",key=side==="left"?"F":"L";
 el.innerHTML='<div class="thead"><div class="badge">'+bd+'</div><div class="tname"><h3>'+name+'</h3><div class="ammo" id="'+side+'-ammo"></div></div><div class="score"><b id="'+side+'-score">0</b><small>SKOR</small></div></div>'+

 if(!flying(T)){var L=w.laser==="long"?40:3,le=P(PIV.x+Math.cos(th)*(BARREL+L),PIV.y+Math.sin(th)*(BARREL+L));
  var lg=c.createLinearGradient(mz.x,mz.y,le.x,le.y);lg.addColorStop(0,T.col);lg.addColorStop(1,w.laser==="long"?T.col+"55":T.col+"00");
  c.strokeStyle=lg;c.lineWidth=2;c.setLineDash([s*.3,s*.2]);c.beginPath();c.moveTo(mz.x,mz.y);c.lineTo(le.x,le.y);c.stroke();c.setLineDash([])}
 var ar=s*2.3;c.strokeStyle="rgba(255,207,90,.7)";c.lineWidth=1.5;c.beginPath();if(T.flip)c.arc(pv.x,pv.y,ar,Math.PI,Math.PI+th);else c.arc(pv.x,pv.y,ar,-th,0);c.stroke();
 c.beginPath();c.moveTo(pv.x,pv.y);c.lineTo(pv.x+side*ar*1.15,pv.y);c.stroke();
 c.fillStyle="#ffcf5a";c.font="800 "+Math.max(11,s*.5)+"px Inter,system-ui";c.textAlign=T.flip?"right":"left";var la=P(PIV.x+Math.cos(th/2)*2.6,PIV.y+Math.sin(th/2)*2.6);c.fillText("θ = "+fmt(T.ang)+"°",la.x+side*4,la.y+4);
 c.save();c.translate(pv.x,pv.y);c.rotate(T.flip?-(Math.PI-th):-th);
 var gr=c.createLinearGradient(0,-s*.3,0,s*.3);gr.addColorStop(0,"#a9b6c6");gr.addColorStop(1,"#4c5a6b");c.fillStyle=gr;rr(c,-s*.35,-s*.28,s*(BARREL+.35),s*.56,s*.12);c.fill();
 c.fillStyle=T.col;c.fillRect(s*(BARREL-.28),-s*.3,s*.18,s*.6);c.restore();
 c.strokeStyle="#55677b";c.lineWidth=2;c.beginPath();c.moveTo(pv.x,pv.y);c.lineTo(pv.x-side*s*.6,P(0,0).y);c.moveTo(pv.x,pv.y);c.lineTo(pv.x+side*s*.3,P(0,0).y);c.stroke();
 c.fillStyle="#7d93a8";c.beginPath();c.arc(pv.x,pv.y,s*.2,0,7);c.fill();
 // tembakan
 var tp={x:w.X,y:w.Y},bp=null;
 if(live){var sim=shot.sim,tc=Math.min(tt,sim.t);bp=sim.ball(tc);tp=sim.targ(tc);
  if(tt>sim.t){var d=tt-sim.t;if(sim.hit){var ddx=Math.min(WW-1-sim.ht.x,sim.vx*.12*d);tp={x:sim.ht.x+ddx,y:Math.max(RT,sim.ht.y+.8*d-.5*w.g*d*d)};bp={x:sim.hb.x+ddx*.4,y:Math.max(RB,sim.hb.y-.5*w.g*d*d)}}
   else{tp=sim.targ(tt);bp=null}}
  if(S.xray)xray(T,sim,tc);
 }
 if(shot)line(c,shot.pts,shot.col,live?.95:.5,2.5);
 var tq=P(tp.x,tp.y);if(held){c.strokeStyle="#55677b";c.lineWidth=1.5;c.beginPath();c.moveTo(mg.x,mg.y+s*.25);c.lineTo(tq.x,tq.y-RT*s);c.stroke()}
 bull(c,tq.x,tq.y,RT*s,"#ffcf5a");
 if(bp){var bq=P(bp.x,bp.y);c.fillStyle=shot.col;c.beginPath();c.arc(bq.x,bq.y,RB*s,0,7);c.fill();c.strokeStyle="#fff";c.globalAlpha=.6;c.lineWidth=1;c.stroke();c.globalAlpha=1}
 for(var i=T.parts.length-1;i>=0;i--){var p=T.parts[i],q=P(p.x,p.y);c.globalAlpha=Math.max(0,p.l);c.fillStyle=p.c;c.fillRect(q.x-2,q.y-2,4,4)}c.globalAlpha=1;
}
function xray(T,sim,tc){
 var c=T.ctx,w=S.world,s=T.s,P=function(x,y){return W2S(T,x,y)},N=6,T0=sim.t||1,side=T.flip?-1:1;
 c.lineWidth=1;
 // garis lurus tanpa gravitasi (arah laras)
 var a0=P(sim.mx,sim.my),a1=sim.aim(T0);a1=P(a1.x,a1.y);c.setLineDash([4,5]);c.strokeStyle="rgba(200,215,230,.35)";c.beginPath();c.moveTo(a0.x,a0.y);c.lineTo(a1.x,a1.y);c.stroke();c.setLineDash([]);
 for(var i=1;i<=N;i++){var t=T0*i/N;if(t>tc+1e-6)break;
  var gq=sim.aim(t),g=P(gq.x,gq.y),bb=sim.ball(t),b=P(bb.x,bb.y),q=P(w.X,sim.targ(t).y);
  c.strokeStyle="rgba(200,215,230,.45)";c.beginPath();c.arc(g.x,g.y,4,0,7);c.stroke();c.beginPath();c.moveTo(g.x,g.y);c.lineTo(b.x,b.y);c.stroke();
  c.fillStyle="rgba(255,255,255,.35)";c.beginPath();c.arc(b.x,b.y,2.5,0,7);c.fill();c.beginPath();c.arc(q.x,q.y,2.5,0,7);c.fill()}
 var gN=sim.aim(tc),gNow=P(gN.x,gN.y),bN=sim.ball(tc),bNow=P(bN.x,bN.y),t0=P(w.X,w.Y),tNow=P(w.X,sim.targ(tc).y);
 var dropB=.5*w.g*tc*tc,dropT=w.Y-sim.targ(tc).y;
 c.font="700 "+Math.max(10,s*.45)+"px Inter,system-ui";c.strokeStyle="#ffcf5a";c.fillStyle="#ffcf5a";c.lineWidth=3;
 c.beginPath();c.moveTo(gNow.x,gNow.y);c.lineTo(gNow.x,bNow.y);c.stroke();
 var tx=t0.x+side*s*2.9;c.beginPath();c.moveTo(tx,t0.y);c.lineTo(tx,tNow.y);c.stroke();
 c.textAlign=T.flip?"left":"right";if(dropB>.05)c.fillText(fmt(dropB,2)+" m",gNow.x-side*8,(gNow.y+bNow.y)/2+4);
 c.textAlign=T.flip?"right":"left";if(dropT>.05)c.fillText(fmt(dropT,2)+" m",tx+side*6,(t0.y+tNow.y)/2+4);
 c.textAlign="center";c.fillStyle="#cfe0ee";var lt=P(w.X-side*5,w.Y+2.6);c.fillText("t = "+fmt(tc,2)+" s",lt.x,lt.y);
}
function line(c,pts,col,a,wid){if(pts.length<2)return;c.globalAlpha=a;c.strokeStyle=col;c.lineWidth=wid;c.beginPath();c.moveTo(pts[0].x,pts[0].y);for(var i=1;i<pts.length;i++)c.lineTo(pts[i].x,pts[i].y);c.stroke();c.globalAlpha=1}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function bull(c,x,y,r,col){[[1,col],[.72,"#f4f7fb"],[.48,col],[.22,"#f4f7fb"]].forEach(function(q){c.fillStyle=q[1];c.beginPath();c.arc(x,y,r*q[0],0,7);c.fill()})}

/* ───── loop ───── */
var last=0;
function frame(now){requestAnimationFrame(frame);var dt=Math.min(.1,(now-(last||now))/1000);last=now;
 if(S.mode==="duel"&&S.phase==="live"){S.elapsed=(now-S.tStart)/1000;var left=Math.max(0,Math.ceil(ROUND_T-S.elapsed));$("timer").textContent=left+" s";$("timerPill").classList.toggle("warn",left<=10);
  if(S.elapsed>=ROUND_T&&!S.timeUp){S.timeUp=true;each(function(T){if(!T.done&&!flying(T)){T.done=true;T.res=T.res||{hit:false,pts:0,shots:T.shots||0,timeout:true};syncTeam(T)}})}}
 var speed=S.slow?.3:1;
 each(function(T){var sh=T.shot;
  if(sh&&!sh.done){var sim=sh.sim;sh.t+=dt*speed;var tc=Math.min(sh.t,sim.t),b=sim.ball(tc),q=W2S(T,b.x,b.y);if(!sh.pts.length||Math.hypot(q.x-sh.pts[sh.pts.length-1].x,q.y-sh.pts[sh.pts.length-1].y)>2)sh.pts.push(q);
   if(sh.t>=sim.t&&!sh.hitShown){sh.hitShown=true;if(sim.hit){for(var i=0;i<26;i++){var a=Math.random()*6.28,v=rnd(2,7);T.parts.push({x:sim.hb.x,y:sim.hb.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c:i%2?"#fff":T.col})}}else tone(160,.2)}
   if(sh.t>=sim.end){sh.done=true;shotFinished(T);if(S.timeUp&&!T.done){T.done=true;T.res={hit:false,pts:0,shots:T.shots||0,timeout:true};syncTeam(T)}}}
  for(var j=T.parts.length-1;j>=0;j--){var p=T.parts[j];p.x+=p.vx*dt*speed;p.y+=p.vy*dt*speed;p.vy-=9.8*dt*speed;p.l-=dt*speed*1.2;if(p.l<=0)T.parts.splice(j,1)}
  draw(T)});
 if(S.mode==="duel"&&S.phase==="live"&&teams.left.done&&teams.right.done&&!flying(teams.left)&&!flying(teams.right)){S.timeUp=false;roundDone()}
}
